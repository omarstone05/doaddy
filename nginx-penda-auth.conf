# Penda Digital SSO - Authentication Service
# This handles auth.penda.digital (OAuth 2.0 / OpenID Connect server)

# HTTP to HTTPS Redirect
server {
    listen 80;
    listen [::]:80;
    server_name auth.penda.digital;
    
    # Allow Let's Encrypt verification
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    
    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS Server - SSO Authentication
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name auth.penda.digital;
    
    root /var/www/penda-sso/public;  # Update this path when SSO app is deployed
    index index.php;

    charset utf-8;

    # SSL Configuration (will be updated by Certbot)
    # ssl_certificate /etc/letsencrypt/live/auth.penda.digital/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/auth.penda.digital/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security Headers (Stricter for auth service)
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # Content Security Policy (Strict for auth)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self'; frame-ancestors 'none';" always;

    # Logging
    access_log /var/log/nginx/penda-auth-access.log;
    error_log /var/log/nginx/penda-auth-error.log;

    # OAuth endpoints
    location /oauth/ {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # OpenID Connect endpoints
    location /.well-known/openid-configuration {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # JWKS endpoint
    location /.well-known/jwks.json {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Main application
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP handler
    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 300;
    }

    # Static files caching
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;
}


